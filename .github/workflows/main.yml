# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events (all branches)
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    strategy:
      fail-fast: false
      matrix:
        smalltalk:
          - Pharo64-13
        smalltalk_config: [ .smalltalk.ston ]
        os: [ ubuntu-latest, macos-latest, windows-2022 ]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.smalltalk }} on ${{ matrix.os }} 
    steps:
      - name: Setup Linux
        run: sudo apt install --yes libglib2.0-0
        shell: bash
        if: runner.os == 'Linux'
      - name: Setup OS X
        run: brew install gtk+4
        shell: bash
        if: runner.os == 'macOS'
      - uses: actions/checkout@v3
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Test on Windows
        run: |
          curl -L https://github.com/pharo-spec/gtk-bundle-builder/releases/download/v1/pharo-vm-Windows-x86_64-gtk-stable.zip --output vm.zip
          unzip -q vm.zip -d extracted
          curl -sL https://repo.msys2.org/mingw/clang64/mingw-w64-clang-x86_64-glib2-2.84.2-1-any.pkg.tar.zst --output glib2.pkg
          tar --zstd -xf glib2.pkg -C extracted --strip-components=2 clang64/bin/gspawn-win64-helper.exe
          export PATH="$PWD/extracted:$PATH"
          set +e
          smalltalkci --vm extracted/Pharo.exe -v -s ${{ matrix.smalltalk }} ${{ matrix.smalltalk_config }} 2>&1
          STCI_EXIT=$?
          echo "STCHK smalltalkci exit=$STCI_EXIT"
          echo "STCHK crash/dump artifacts:"
          find . extracted "$HOME/.smalltalkCI" -maxdepth 3 \( -name "*.log" -o -name "core*" -o -name "*.dmp" -o -name "crash*" -o -name "*.stack" \) 2>/dev/null
          cat extracted/PharoDebug.log 2>/dev/null
          exit $STCI_EXIT
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 30
      - name: Test
        run: smalltalkci -s ${{ matrix.smalltalk }} ${{ matrix.smalltalk_config }}
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 30
